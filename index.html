<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love Clock Timer</title>

<!-- Apple PWA support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Love Clock Timer">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Base styling */
html, body {
  margin: 0;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  font-family: Arial, sans-serif;
  min-height: 100vh;
  width: 100%;
  box-sizing: border-box;
}

/* Setup Screen */
#setupScreen {
  padding: 40px 20px;
  text-align: center;
  background: white;
  min-height: 100%;
  box-sizing: border-box;
}

/* Timer Screen */
#timerScreen {
  display: none;
  position: fixed;
  inset: 0;
  background: black;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* Live clock at top */
#currentTime {
  font-size: 2em;
  margin-top: env(safe-area-inset-top, 20px);
  color: white;
  z-index: 10;
}

/* Countdown timer centered below */
#timerContainer {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
}

#timer {
  font-size: 5em;
  font-weight: bold;
}

/* Input and buttons */
input {
  padding: 10px;
  font-size: 1rem;
  width: 220px;
  margin-bottom: 20px;
}

button {
  padding: 10px 20px;
  font-size: 1rem;
  margin: 5px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- Setup Screen -->
<div id="setupScreen">
  <h1>Love Clock Timer</h1>
  <label>Minutes:
    <input type="number" id="minutesInput" value="1" min="0">
  </label>
  <br><br>
  <button onclick="startTimer()">Start</button>
  <button onclick="clearTimer()">Clear</button>
</div>

<!-- Timer Screen -->
<div id="timerScreen" onclick="togglePause()">
  <div id="currentTime"></div>
  <div id="timerContainer">
    <div id="timer">00:00</div>
  </div>
</div>

<script>
let totalSeconds = 0;
let paused = false;
let interval;

// Start Timer
function startTimer() {
  const minutes = parseInt(document.getElementById("minutesInput").value) || 0;
  totalSeconds = minutes * 60;
  paused = false;

  document.getElementById("setupScreen").style.display = "none";
  document.getElementById("timerScreen").style.display = "flex";

  updateClock();
  updateDisplay();

  interval = setInterval(() => {
    if (!paused) {
      totalSeconds--;
      updateDisplay();
    }
  }, 1000);
}

// Update Countdown Display
function updateDisplay() {
  const timer = document.getElementById("timer");
  const absSeconds = Math.abs(totalSeconds);
  const mins = Math.floor(absSeconds / 60);
  const secs = absSeconds % 60;

  timer.textContent =
    (totalSeconds < 0 ? "-" : "") +
    String(mins).padStart(2, "0") +
    ":" +
    String(secs).padStart(2, "0");

  timer.style.color = totalSeconds < 0 ? "red" : "white";
}

// Pause / Resume
function togglePause() {
  paused = !paused;
}

// Clear Timer (hard stop)
function clearTimer() {
  clearInterval(interval);
  paused = false;
  totalSeconds = 0;

  document.getElementById("timerScreen").style.display = "none";
  document.getElementById("setupScreen").style.display = "block";
}

// Live Clock at top
function updateClock() {
  const now = new Date();
  document.getElementById("currentTime").textContent = now.toLocaleTimeString();
}

// Update clock every second
setInterval(updateClock, 1000);

// iOS orientation / resize fix (ensures centered timer)
function resizeTimer() {
  const timerScreen = document.getElementById('timerScreen');
  if (timerScreen.style.display === "flex") {
    timerScreen.style.display = "none";
    setTimeout(() => { timerScreen.style.display = "flex"; }, 10);
  }
}
window.addEventListener('orientationchange', resizeTimer);
window.addEventListener('resize', resizeTimer);
</script>

</body>
</html>
